# CD: on main and on version tags, run CI first, then publish a Docker image per service to
# GitHub Container Registry (ghcr.io). A tag like v1.2.0 also creates a GitHub Release.
#
#   push to main  -> ghcr.io/<owner>/opencrypto-<image>:latest and :sha-<short sha>
#   tag v1.2.0    -> ... :1.2.0 and :1.2 and :sha-<short sha>, plus a GitHub Release
name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a half-finished publish; queue the next one instead.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.image }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: api-gateway, context: ., file: services/Dockerfile}
          - {image: identity-service, context: ., file: services/Dockerfile}
          - {image: asset-service, context: ., file: services/Dockerfile}
          - {image: wallet-service, context: ., file: services/Dockerfile}
          - {image: transaction-service, context: ., file: services/Dockerfile}
          - {image: swap-service, context: ., file: services/Dockerfile}
          - {image: ai-copilot-service, context: ., file: services/Dockerfile}
          - {image: frontend, context: frontend, file: frontend/Dockerfile}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (registry paths must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opencrypto-${{ matrix.image }}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: SERVICE=${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release with notes generated from merged PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
