# CI: build and test everything. Runs on every pull request, and is called by cd.yml for
# pushes to main and version tags, so the tests are defined once and gate every release.
name: CI
on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run that is now out of date. The group includes the
# event name so it never equals cd.yml's group when this file is called from there.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (unit + Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit + Testcontainers integration tests
        run: mvn --batch-mode clean verify
      - name: Validate docker-compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.release.yml config -q
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: surefire-reports
          path: '**/target/*-reports/'

  frontend:
    name: Frontend (build + a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Accessibility lab (axe-core, no backend needed)
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 > /dev/null && break; sleep 1; done
          A11Y_BASE_URL=http://localhost:4173 npx playwright test -g "seeded lab"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: a11y-report
          path: |
            frontend/a11y-report/
            frontend/playwright-report/
