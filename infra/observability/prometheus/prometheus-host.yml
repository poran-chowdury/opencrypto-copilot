# Services running on the host (scripts/run-local); Prometheus runs in Docker.
global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: ["alerts.yml"]
scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["host.docker.internal:8080"]}]
  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["host.docker.internal:8081"]}]
  - job_name: asset-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["host.docker.internal:8082"]}]
  - job_name: wallet-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["host.docker.internal:8083"]}]
  - job_name: transaction-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["host.docker.internal:8084"]}]
  - job_name: swap-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["host.docker.internal:8085"]}]
  - job_name: ai-copilot-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["host.docker.internal:8086"]}]
  - job_name: rabbitmq
    metrics_path: /metrics/per-object   # per-queue depth, including dead-letter queues
    static_configs: [{targets: ["rabbitmq:15692"]}]
