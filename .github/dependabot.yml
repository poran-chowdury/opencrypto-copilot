# Weekly dependency update PRs. Each PR runs CI, so an upgrade that breaks a test never lands.
# Minor and patch bumps are grouped into one PR per ecosystem to keep the noise down.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: {interval: weekly}
    groups:
      maven-minor: {update-types: [minor, patch]}
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    groups:
      npm-minor: {update-types: [minor, patch]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ['*']}
  - package-ecosystem: docker
    directories: [/services, /frontend]
    schedule: {interval: weekly}
