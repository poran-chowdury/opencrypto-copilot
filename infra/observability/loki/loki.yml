# Single-process Loki for local development: filesystem storage, 7-day retention.
# In production you'd run it in "simple scalable" mode with object storage (S3/GCS).
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  # correlation ids are stored as structured metadata: searchable per line, but not an index label
  allow_structured_metadata: true
  # host-mode logs may be shipped late (e.g. Alloy started after the services)
  reject_old_samples: false

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
