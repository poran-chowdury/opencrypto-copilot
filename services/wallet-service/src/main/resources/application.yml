server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful
spring:
  application:
    name: wallet-service
  ai:
    mcp:
      server:
        enabled: true
        name: wallet-mcp
        version: 0.1.0
        protocol: streamable
        streamable-http:
          mcp-endpoint: /mcp
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:opencrypto}?currentSchema=wallet
    username: ${WALLET_DB_USER:wallet_svc}
    password: ${WALLET_DB_PASSWORD:wallet_localdev}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    schemas: wallet
    default-schema: wallet
    locations: classpath:db/migration,classpath:db/platform
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:opencrypto}
    password: ${RABBITMQ_PASSWORD:localdev_only_change_me}
    publisher-confirm-type: simple
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false     # after retries, reject -> dead-letter queue
        prefetch: 10
        # 4 consumers on wallet.commands instead of 1: one consumer capped the saga at ~5 swaps/s
        # (docs/engineering/11-load-testing.md). Safe without ordering because the reservation's
        # primary key makes reserve/release race-free, and the ledger locks accounts in id order.
        concurrency: 4
        max-concurrency: 4
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 500ms
          multiplier: 3
          max-interval: 10s

platform:
  messaging:
    enabled: true

services:
  asset-url: ${ASSET_SERVICE_URL:http://localhost:8082}

wallet:
  opening-balance-usd: 10000
  max-deposit-usd: 1000000
  reconciliation-interval: PT5M

resilience4j:
  retry:
    instances:
      assetService:
        max-attempts: 2
        wait-duration: 200ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
  circuitbreaker:
    instances:
      assetService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"

---
spring:
  config:
    activate:
      on-profile: json-logs
logging:
  structured:
    format:
      console: ecs
