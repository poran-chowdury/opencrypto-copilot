server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful
spring:
  application:
    name: swap-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:opencrypto}?currentSchema=swap
    username: ${SWAP_DB_USER:swap_svc}
    password: ${SWAP_DB_PASSWORD:swap_localdev}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    schemas: swap
    default-schema: swap
    locations: classpath:db/migration,classpath:db/platform
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:opencrypto}
    password: ${RABBITMQ_PASSWORD:localdev_only_change_me}
    publisher-confirm-type: simple
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false     # after retries, reject -> dead-letter queue
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 500ms
          multiplier: 3
          max-interval: 10s

platform:
  messaging:
    enabled: true

services:
  asset-url: ${ASSET_SERVICE_URL:http://localhost:8082}

swap:
  fee-bps: 25                  # 0.25% application fee
  quote-ttl: PT30S
  timeout: PT30S               # no progress for this long -> ask the wallet to release
  release-retry: PT60S         # re-ask if the wallet stays silent
  recovery-interval: PT5S

resilience4j:
  retry:
    instances:
      assetService:
        max-attempts: 2
        wait-duration: 200ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
  circuitbreaker:
    instances:
      assetService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"

---
spring:
  config:
    activate:
      on-profile: json-logs
logging:
  structured:
    format:
      console: ecs
