apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # In a log line's details, correlation_id becomes a link to that request's timeline.
      derivedFields:
        - name: correlation_id
          matcherType: label
          matcherRegex: correlation_id
          url: /d/opencrypto-request?var-correlation_id=$${__value.raw}
          urlDisplayLabel: Trace this request
        # In a log line's details, trace_id opens the distributed trace in Tempo.
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: $${__value.raw}
          urlDisplayLabel: Open trace in Tempo
