server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful
spring:
  application:
    name: transaction-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:opencrypto}?currentSchema=txn
    username: ${TXN_DB_USER:txn_svc}
    password: ${TXN_DB_PASSWORD:txn_localdev}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    schemas: txn
    default-schema: txn
    locations: classpath:db/migration,classpath:db/platform
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:opencrypto}
    password: ${RABBITMQ_PASSWORD:localdev_only_change_me}
    publisher-confirm-type: simple
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false     # after retries, reject -> dead-letter queue
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 500ms
          multiplier: 3
          max-interval: 10s

platform:
  messaging:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"

---
spring:
  config:
    activate:
      on-profile: json-logs
logging:
  structured:
    format:
      console: ecs
